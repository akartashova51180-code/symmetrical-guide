services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [brain-net]

  app:
    build:
      context: ../../..
      dockerfile: system/runtime/Dockerfile
    restart: unless-stopped
    environment:
      CORPORATE_BRAIN_DATABASE_URL: postgresql://brain:${POSTGRES_PASSWORD}@db:5432/brain
      CORPORATE_BRAIN_DATA_DIR: /data
      CORPORATE_BRAIN_SOURCE_DIR: /app/system
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_NOTIFY_CHAT_ID: ${TELEGRAM_NOTIFY_CHAT_ID:-}
    volumes:
      - ${DATA_ROOT:-/srv/anastasia-brain/data}:/data
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [brain-net]

  telegram-bot:
    build:
      context: ../../..
      dockerfile: system/runtime/Dockerfile
    command: ["python", "-m", "corporate_brain.telegram_intake"]
    restart: unless-stopped
    environment:
      CORPORATE_BRAIN_DATABASE_URL: postgresql://brain:${POSTGRES_PASSWORD}@db:5432/brain
      CORPORATE_BRAIN_DATA_DIR: /data
      CORPORATE_BRAIN_API: http://app:8787
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in .env}
    volumes:
      - ${DATA_ROOT:-/srv/anastasia-brain/data}:/data
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks: [brain-net]

volumes:
  postgres-data:

networks:
  brain-net:
