name: Sync gateway tests
on:
  push:
    branches:
      - codex/sync-journal-2026-11-19
    paths:
      - ".github/workflows/sync-tests.yml"
      - "system/runtime/**"
  pull_request:
    paths:
      - "system/runtime/**"
      - ".github/workflows/sync-tests.yml"
permissions:
  contents: read
jobs:
  sync-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9'
      - name: Run sync tests
        env:
          PYTHONPATH: corporate_brain
        run: python -m pytest -q tests/test_sync_core.py tests/test_github_ingest.py
