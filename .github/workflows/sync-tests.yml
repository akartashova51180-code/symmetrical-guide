name: Sync gateway tests
on:
  push:
    branches:
      - codex/sync-journal-2026-11-19
    paths:
      - ".github/workflows/sync-tests.yml"
      - "system/runtime/**"
  pull_request:
    paths:
      - "system/runtime/**"
      - ".github/workflows/sync-tests.yml"
permissions:
  contents: read
jobs:
  sync-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sync_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: system/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9' 'psycopg[binary]>=3.2,<4' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Run sync tests
        env:
          PYTHONPATH: corporate_brain
          SYNC_TEST_POSTGRES_DSN: postgresql://postgres:ci-only-password@127.0.0.1:5432/sync_integration
        run: python -m pytest -q tests/test_sync_core.py tests/test_github_ingest.py tests/test_supabase_transport.py tests/test_sync_worker.py tests/test_sync_postgres_integration.py tests/test_github_transport.py tests/test_sync_http_contract.py tests/test_sync_local_http_e2e.py
